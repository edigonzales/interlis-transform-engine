basketIdStrategy: integer
mappings:
  - targetClass: DM01AVCH24LV95D.Liegenschaften.LSNachfuehrung
    sources:
      - sourceClass: DMAV_Grundstuecke_V1_0.Grundstuecke.GSNachfuehrung
    oidStrategy: integer
    attributes:
      - target: NBIdent
        expr: "${src.NBIdent}"
      - target: Identifikator
        expr: "${src.Identifikator}"
      - target: Beschreibung
        expr: "${src.Beschreibung}"
      - target: Perimeter
        expr: "${src.Perimeter}"
      #- target: Mutationsart
      #  expr: "'Normal'"
      - target: Gueltigkeit
        expr: "if(${src.Grundbucheintrag} != null, 'gueltig', 'projektiert')"
      - target: GueltigerEintrag
        expr: "from_xml_datetime(${src.GueltigerEintrag})"
      - target: GBEintrag
        expr: "from_xml_datetime(${src.Grundbucheintrag})"
