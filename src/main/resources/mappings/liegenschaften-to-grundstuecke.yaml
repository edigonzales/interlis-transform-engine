mappings:
  - sourceClass: Liegenschaften.LSNachfuehrung
    targetClass: Grundstuecke.GSNachfuehrung
    oidStrategy: preserve
    attributes:
      - target: NBIdent
        expr: "${src.NBIdent}"
      - target: Identifikator
        expr: "${src.Identifikator}"
      - target: Beschreibung
        expr: "${src.Beschreibung}"
      - target: Perimeter
        expr: "${src.Perimeter}"
      - target: Mutationsart
        expr: "'Normal'"
      - target: GueltigerEintrag
        expr: "coalesce(${src.GueltigerEintrag}, ${src.Datum1}, ${src.Datum2})"
      - target: Grundbucheintrag
        expr: "coalesce(${src.GBEintrag}, ${src.Datum2})"
