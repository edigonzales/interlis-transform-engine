mappings:
  - sourceClass: DM01AVCH24LV95D.Liegenschaften.LSNachfuehrung
    targetClass: DMAV_Grundstuecke_V1_0.Grundstuecke.GSNachfuehrung
    oidStrategy: preserve
    attributes:
      - target: NBIdent
        expr: "${src.NBIdent}"
      - target: Identifikator
        expr: "${src.Identifikator}"
      - target: Beschreibung
        expr: "${src.Beschreibung}"
      - target: Perimeter
        expr: "${src.Perimeter}"
      - target: Mutationsart
        expr: "'Normal'"
      - target: GueltigerEintrag
        expr: "coalesce(to_xml_date(${src.GueltigerEintrag}, 'yyyyMMdd'), to_xml_date(${src.Datum1}, 'yyyyMMdd'), to_xml_date(${src.Datum2}, 'yyyyMMdd'))"
      - target: Grundbucheintrag
        expr: "coalesce(to_xml_date(${src.GBEintrag}, 'yyyyMMdd'), to_xml_date(${src.Datum2}, 'yyyyMMdd'))"
